<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Photo Gallery</title>
	<link rel="stylesheet" href="css/gallery.css">
	<script src="js/galery.js"></script>
</head>

<body onload="setImages()">

	<div id="image">
		Hover over an image below to display here.
	</div>

	<div class="image-container">
		<img class="preview" alt="Anime 1" src="./images/anime1.jpg" onmouseover="upDate(this)"
			onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">

		<img class="preview" alt="Anime 2" src="./images/anime2.jpg" onmouseover="upDate(this)"
			onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">

		<img class="preview" alt="Anime 3" src="./images/anime3.jpg" onmouseover="upDate(this)"
			onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">
	</div>

</body>

</html>
